name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for the repo's own CI: it only needs to read code.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # CI never pushes, so don't leave a token in .git/config.
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: pytest

  # Dogfood: run the composite action exactly as a consumer would, in
  # rules-only dry-run mode. Catches a broken action.yml before users do.
  # Only on pull_request: the Action refuses every other event by design.
  action-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # dry-run never posts, so read is enough here. (Fork PRs are downgraded to
    # read-only by GitHub regardless.)
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          dry-run: "true"
          fail-on: high
          # tests/fixtures and examples/ hold INTENTIONALLY bad files (rule tests
          # and demo inputs), so exclude them: the repo's own code must pass its
          # own review. Keep this list identical to pr-guardian.yml (a test checks).
          paths: |
            !tests/fixtures/**
            !examples/**
