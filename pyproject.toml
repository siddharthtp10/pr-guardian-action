[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-guardian-action"
version = "0.1.0"
description = "Reviews infrastructure/config pull requests with a deterministic rules engine and an optional AI layer."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# Exact pin; must equal requirements.in (a test enforces it). The full hash-locked
# set lives in requirements.txt.
dependencies = ["pyyaml==6.0.3"]

[project.optional-dependencies]
# Only installed when an Anthropic API key is supplied (see action.yml). The full
# transitive set is hash-locked in requirements-ai.txt.
ai = ["anthropic==1.11.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pr_guardian = ["policies/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The Action runs from source via PYTHONPATH (no install step), so tests do too.
pythonpath = ["src"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle. I: import order. B: bugbear. UP: modern syntax.
# SIM: simplifications. S: bandit security checks - worth it for a security tool.
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
# pytest uses bare `assert`; bandit's S101 would flag every test.
"tests/**" = ["S101"]
