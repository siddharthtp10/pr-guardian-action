name: PR Guardian
description: >-
  Reviews pull requests that change Terraform, Kubernetes YAML, GitHub Actions
  workflows and Dockerfiles. Deterministic rules first, optional AI second.
author: siddharthtp10
branding:
  icon: shield
  color: blue

inputs:
  github-token:
    description: >-
      Token used to read the PR diff and post the review. Needs only
      `contents: read` and `pull-requests: write`. On fork PRs GitHub makes it
      read-only; the Action then reports instead of posting.
    required: false
    default: ${{ github.token }}
  anthropic-api-key:
    description: >-
      Optional. Pass it from a GitHub secret (never a literal). When empty the
      Action runs in rules-only mode.
    required: false
    default: ""
  model:
    description: Anthropic model ID used by the AI layer (ignored in rules-only mode).
    required: false
    default: claude-sonnet-5-5
  fail-on:
    description: >-
      Lowest rule severity that fails the check: low, medium, high, critical,
      or none. AI findings never fail the check.
    required: false
    default: high
  paths:
    description: >-
      Newline- or comma-separated glob patterns limiting which changed files
      are reviewed. Empty = every supported file type.
    required: false
    default: ""
  max-files:
    description: Maximum number of changed files reviewed per run (1-500). Extras are reported as skipped.
    required: false
    default: "50"
  dry-run:
    description: "'true' prints findings to the log instead of posting a review."
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Python
      # Pinned to a full commit SHA: a tag can be moved by whoever controls the
      # upstream repo, a SHA cannot. Tag shown in the comment for humans.
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Install runtime dependencies
      shell: bash
      env:
        REQUIREMENTS: ${{ github.action_path }}/requirements.txt
      # One pinned dependency (PyYAML, to read the policy file). Everything
      # else is standard library. Hash-pinning is listed as a production
      # hardening step in the README.
      run: python -m pip install --disable-pip-version-check --no-input -r "$REQUIREMENTS"

    - name: Run PR Guardian
      shell: bash
      # Inputs go through `env:`, never `${{ }}` inside `run:`. Interpolating
      # inputs into the script text would let a crafted value inject shell.
      env:
        PRG_GITHUB_TOKEN: ${{ inputs.github-token }}
        PRG_ANTHROPIC_API_KEY: ${{ inputs.anthropic-api-key }}
        PRG_MODEL: ${{ inputs.model }}
        PRG_FAIL_ON: ${{ inputs.fail-on }}
        PRG_PATHS: ${{ inputs.paths }}
        PRG_MAX_FILES: ${{ inputs.max-files }}
        PRG_DRY_RUN: ${{ inputs.dry-run }}
        # Run straight from the action's own checkout (no package install).
        PYTHONPATH: ${{ github.action_path }}/src
        PYTHONDONTWRITEBYTECODE: "1"
      run: python -m pr_guardian
